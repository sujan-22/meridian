fragment TicketSummaryFields on TicketSummary {
    ticketNumber
    trackedMinutes
    billableMinutes
    unbillableMinutes
    entryCount
    firstTrackedAt
    lastTrackedAt
    estimateMinMinutes
    estimateMaxMinutes
    estimateNotes
    remainingMinutes
    status

    project {
        ...ProjectFields
    }

    entries {
        id
        description
        kind
        billingType
        unbillablePercent
        startedAt
        endedAt
        billedMinutes
        billableMinutes
        unbillableMinutes
    }
}

query TicketSummaries {
    ticketSummaries {
        ...TicketSummaryFields
    }
}

mutation SetTicketEstimate($input: SetTicketEstimateInput!) {
    setTicketEstimate(input: $input) {
        ...TicketSummaryFields
    }
}

mutation ClearTicketEstimate($projectId: ID!, $ticketNumber: String!) {
    clearTicketEstimate(projectId: $projectId, ticketNumber: $ticketNumber) {
        ...TicketSummaryFields
    }
}

mutation ImportTimeEntries(
    $rows: [ImportTimeEntryInput!]!
    $createMissingProjects: Boolean
) {
    importTimeEntries(
        rows: $rows
        createMissingProjects: $createMissingProjects
    ) {
        imported
        duplicatesSkipped
        unmatchedRows
        projectsCreated
        clientsCreated
    }
}
