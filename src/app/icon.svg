<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- A tab strip can be any colour, so the icon carries its own dark tile.
       This is the one place the mark needs a background: in the app it takes
       the colour of whatever it sits on. -->
  <rect width="48" height="48" rx="11" fill="#09090b"/>

  <g fill="none" stroke="#fafafa">
    <circle cx="24" cy="24" r="15" stroke-width="3"/>
    <ellipse cx="24" cy="24" rx="6" ry="15" stroke-width="2.5"/>
  </g>
</svg>
